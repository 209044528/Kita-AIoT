services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kita_aiot
      POSTGRES_USER: kita
      POSTGRES_PASSWORD: kita_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kita -d kita_aiot"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://kita:kita_password@postgres:5432/kita_aiot
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC: aiot/device/alarm
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-device-documents}
      DIFY_API_BASE_URL: ${DIFY_API_BASE_URL:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_WORKFLOW_ENABLED: ${DIFY_WORKFLOW_ENABLED:-false}
      DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-180}
      DIFY_SERIALIZE_COMPLEX_INPUTS: ${DIFY_SERIALIZE_COMPLEX_INPUTS:-false}
      BAILIAN_API_BASE_URL: ${BAILIAN_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_TIMEOUT_SECONDS: ${BAILIAN_TIMEOUT_SECONDS:-120}
      AGENT_PLATFORM: ${AGENT_PLATFORM:-auto}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/webhook/kita-aiot/alarm}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/credentials:/credentials:ro
    depends_on:
      api:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  n8n_data:
