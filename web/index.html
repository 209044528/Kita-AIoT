<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kita-AIoT Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>
    
    <div class="app-container">
        <header class="glass-panel main-header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>Kita-AIoT <span class="highlight">Monitor</span></h1>
            </div>
            <div class="header-stats">
                <div class="stat-badge platform-badge" id="dify-status">Dify --</div>
                <div class="stat-badge platform-badge" id="bailian-status">百炼 --</div>
                <div class="stat-badge">
                    <span class="stat-dot online"></span>
                    <span id="online-count">0</span> 在线设备
                </div>
                <div class="stat-badge">
                    <span>⚙️</span>
                    <span id="workflow-count">0</span> 工作流
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Devices Section -->
            <section class="glass-panel devices-section">
                <div class="section-header">
                    <h2><span class="icon">📦</span> 边缘设备</h2>
                    <button class="icon-btn" onclick="app.fetchData()" title="刷新">🔄</button>
                </div>
                <div class="devices-grid" id="devices-container">
                    <!-- Devices will be injected here -->
                    <div class="loading-spinner"></div>
                </div>
            </section>

            <!-- Alarms Section -->
            <section class="glass-panel alarms-section">
                <div class="section-header">
                    <h2><span class="icon">🚨</span> 实时告警</h2>
                </div>
                <div class="alarms-list" id="alarms-container">
                    <!-- Alarms will be injected here -->
                    <div class="loading-spinner"></div>
                </div>
            </section>

            <!-- Work Orders Section -->
            <section class="glass-panel work-orders-section">
                <div class="section-header">
                    <h2><span class="icon">📋</span> 工单追踪</h2>
                </div>
                <div class="work-orders-list" id="work-orders-container">
                    <div class="empty-state">暂无工单</div>
                </div>
            </section>

            <section class="glass-panel workflows-section">
                <div class="section-header">
                    <h2><span class="icon">⚙️</span> 工作流执行</h2>
                </div>
                <div class="workflows-list" id="workflows-container">
                    <div class="empty-state">暂无执行记录</div>
                </div>
            </section>
        </main>

        <section class="control-grid">
            <div class="glass-panel agent-console">
                <div class="section-header">
                    <h2><span class="icon">🤖</span> 告警 → Agent → RAG → 工单</h2>
                </div>
                <form id="alarm-form" class="console-form">
                    <div class="form-row">
                        <label>设备
                            <select id="alarm-device">
                                <option value="device-001">device-001 冷链网关</option>
                                <option value="device-002">device-002 振动传感器</option>
                                <option value="device-003">device-003 边缘采集器</option>
                            </select>
                        </label>
                        <label>平台
                            <select id="alarm-platform">
                                <option value="auto">自动选择</option>
                                <option value="dify">Dify</option>
                                <option value="bailian">阿里百炼</option>
                                <option value="local">本地规则</option>
                            </select>
                        </label>
                        <label>等级
                            <select id="alarm-level">
                                <option value="warning">warning</option>
                                <option value="critical">critical</option>
                                <option value="info">info</option>
                            </select>
                        </label>
                    </div>
                    <label>告警描述
                        <textarea id="alarm-message" rows="3">冷链温控网关温度持续超过 80 摄氏度，请分析并判断是否创建工单。</textarea>
                    </label>
                    <button class="primary-btn" type="submit">运行完整链路</button>
                </form>
                <pre class="result-box" id="alarm-result">等待触发...</pre>
            </div>

            <div class="glass-panel knowledge-console">
                <div class="section-header">
                    <h2><span class="icon">📚</span> 知识库问答</h2>
                </div>
                <form id="knowledge-form" class="console-form">
                    <div class="form-row">
                        <label>平台
                            <select id="knowledge-platform">
                                <option value="auto">自动选择</option>
                                <option value="dify">Dify</option>
                                <option value="bailian">阿里百炼</option>
                                <option value="local">本地 RAG</option>
                            </select>
                        </label>
                        <label>设备上下文
                            <select id="knowledge-device">
                                <option value="">无</option>
                                <option value="device-001">device-001</option>
                                <option value="device-002">device-002</option>
                                <option value="device-003">device-003</option>
                            </select>
                        </label>
                    </div>
                    <label>问题
                        <textarea id="knowledge-question" rows="3">温度超过 80 摄氏度时，SOP 要求如何处理？</textarea>
                    </label>
                    <button class="primary-btn" type="submit">检索并回答</button>
                </form>
                <div class="answer-box" id="knowledge-answer">等待提问...</div>
                <div class="reference-list" id="knowledge-references"></div>
            </div>
        </section>
    </div>

    <!-- Templates for JavaScript cloning -->
    <template id="device-card-template">
        <div class="device-card">
            <div class="device-header">
                <h3 class="device-name"></h3>
                <span class="status-indicator"></span>
            </div>
            <div class="device-body">
                <div class="device-meta">
                    <span class="meta-icon">📍</span>
                    <span class="location"></span>
                </div>
                <div class="device-metrics">
                    <div class="metric">
                        <span class="metric-label">温度</span>
                        <span class="metric-value temp-value">--°C</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">电量</span>
                        <div class="battery-bar-container">
                            <div class="battery-bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="alarm-item-template">
        <div class="alarm-item">
            <div class="alarm-icon"></div>
            <div class="alarm-content">
                <div class="alarm-header">
                    <span class="alarm-type"></span>
                    <span class="alarm-time"></span>
                </div>
                <p class="alarm-message"></p>
                <div class="alarm-device"></div>
            </div>
        </div>
    </template>

    <template id="record-item-template">
        <div class="record-item">
            <div>
                <strong class="record-title"></strong>
                <p class="record-meta"></p>
            </div>
            <span class="record-status"></span>
        </div>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
